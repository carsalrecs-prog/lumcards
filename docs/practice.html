<body class="practice-studio">
  <a class="studio-skip" href="#play-content">Saltar al contenido</a>
  <aside class="studio-sidebar" aria-label="Navegación de Lumcards">
    <a class="studio-brand" href="/" aria-label="Lumcards · Mi biblioteca">
      <div class="play-brand-mark" aria-hidden="true">L<span>✦</span></div>
      <span><strong>Lumcards</strong><small>Aprende a tu ritmo</small></span>
    </a>
    <span class="studio-nav-label">TU ESPACIO</span>
    <a class="studio-library" href="/"><span aria-hidden="true">↗</span> Mi biblioteca</a>
    <nav class="play-tabs" aria-label="Práctica e importación">
      <button type="button" class="btn active" data-tab="play"><span class="studio-nav-icon" aria-hidden="true">✦</span> Jugar y aprender</button>
      <button type="button" class="btn" data-tab="import"><span class="studio-nav-icon" aria-hidden="true">↥</span> Importar texto</button>
      <button type="button" class="btn" data-tab="history"><span class="studio-nav-icon" aria-hidden="true">≋</span> Mis resultados</button>
    </nav>
    <div class="studio-sidebar-bottom">
      <button type="button" class="studio-theme-toggle" data-action="toggle-theme" aria-pressed="false"><span class="studio-theme-orb" aria-hidden="true"></span><span data-theme-label>Modo oscuro</span></button>
      <p>Un poco,<br>todos los días.</p>
    </div>
  </aside>
  <header class="play-header">
    <a class="btn" href="/">← Mi biblioteca</a>
    <div class="play-header-brand">
      <div class="play-brand-mark">L<span>✦</span></div>
      <strong>Lumcards</strong>
    </div>
    <span class="play-header-tag">Suite de Aprendizaje Dinámico</span>
  </header>
  <main class="play-main">
    <p id="play-status" role="status" aria-live="polite"></p>
    <div id="play-content" tabindex="-1"><p>Preparando tus mazos…</p></div>
  </main>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>
